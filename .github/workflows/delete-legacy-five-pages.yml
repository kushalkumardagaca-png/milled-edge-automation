name: Delete five legacy pages (guarded, destructive)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/4d7c35f7-milled-edge-automation
    paths:
      - 'trigger/delete-legacy-five-pages.txt'

permissions:
  contents: write

concurrency:
  group: delete-legacy-five-pages
  cancel-in-progress: false

jobs:
  delete:
    name: Preflight then permanently delete only five legacy pages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check confirmation phrase
        id: confirm
        run: |
          if grep -qx 'CONFIRM: DELETE ONLY THE FIVE LEGACY MILLED EDGE PAGES' trigger/delete-legacy-five-pages.txt; then
            echo 'confirmed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'confirmed=false' >> "$GITHUB_OUTPUT"
            echo 'Trigger file is inactive. Nothing will be deleted.'
          fi

      - name: Set up Python
        if: steps.confirm.outputs.confirmed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.confirm.outputs.confirmed == 'true'
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Preflight and delete
        if: steps.confirm.outputs.confirmed == 'true'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          mkdir -p artifacts
          set +e
          python scripts/delete_legacy_five_pages.py 2>&1 | tee artifacts/delete-legacy-five-pages.log
          STATUS=${PIPESTATUS[0]}
          echo "$STATUS" > artifacts/delete-legacy-five-pages.exit
          exit "$STATUS"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delete-legacy-five-pages
          path: artifacts/
          if-no-files-found: warn

      - name: Save report to repository
        if: always() && steps.confirm.outputs.confirmed == 'true'
        run: |
          mkdir -p reports artifacts
          for file in delete-legacy-five-pages-report.json delete-legacy-five-pages.log delete-legacy-five-pages.exit; do
            if [ -f "artifacts/$file" ]; then cp "artifacts/$file" "reports/$file"; fi
          done
          printf '%s\n' "${{ github.run_id }}" > reports/delete-legacy-five-pages-run-id.txt
          printf '%s\n' "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > reports/delete-legacy-five-pages-run-url.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/delete-legacy-five-pages-report.json reports/delete-legacy-five-pages.log reports/delete-legacy-five-pages.exit reports/delete-legacy-five-pages-run-id.txt reports/delete-legacy-five-pages-run-url.txt
          if git diff --cached --quiet; then
            echo 'No report changes to commit.'
          else
            git commit -m 'Delete-legacy-five-pages report [skip ci]'
            git pull --rebase origin arena/4d7c35f7-milled-edge-automation
            git push origin HEAD:arena/4d7c35f7-milled-edge-automation
          fi
