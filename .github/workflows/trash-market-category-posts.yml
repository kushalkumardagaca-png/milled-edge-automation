name: Move project market posts to Blogger Trash

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type TRASH 100 PROJECT POSTS to move only the verified project posts to Blogger Trash
        required: true
        type: string

permissions:
  contents: read

jobs:
  trash-project-posts:
    if: inputs.confirm == 'TRASH 100 PROJECT POSTS'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Blogger API dependencies
        run: pip install --quiet google-auth google-api-python-client google-auth-httplib2
      - name: Preflight exact target set (no writes)
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python scripts/trash_market_category_posts.py --dry-run
      - name: Move exact project posts to Trash and verify
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python scripts/trash_market_category_posts.py --confirm 'TRASH 100 PROJECT POSTS'
