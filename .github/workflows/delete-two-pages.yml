name: Delete Daily news and Daily article pages (destructive)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'trigger/delete-two-pages.txt'

permissions:
  contents: write

concurrency:
  group: delete-two-pages
  cancel-in-progress: false

jobs:
  delete-pages:
    name: Permanently delete only the two allowlisted pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check confirmation phrase
        id: confirm
        run: |
          if grep -qx 'CONFIRM: DELETE DAILY NEWS AND DAILY ARTICLE PAGES' trigger/delete-two-pages.txt; then
            echo 'confirmed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'confirmed=false' >> "$GITHUB_OUTPUT"
            echo 'Trigger file is inactive. Nothing will be deleted.'
          fi

      - name: Set up Python
        if: steps.confirm.outputs.confirmed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.confirm.outputs.confirmed == 'true'
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Delete the two pages
        id: delete
        if: steps.confirm.outputs.confirmed == 'true'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          mkdir -p artifacts
          set +e
          python scripts/delete_two_pages.py 2>&1 | tee artifacts/delete-two-pages.log
          STATUS=${PIPESTATUS[0]}
          echo "$STATUS" > artifacts/delete-two-pages.exit
          exit "$STATUS"

      - name: Upload deletion artifact
        if: always() && steps.confirm.outputs.confirmed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: delete-two-pages
          path: artifacts/
          if-no-files-found: warn

      - name: Save deletion report to repository
        if: always() && steps.confirm.outputs.confirmed == 'true'
        run: |
          mkdir -p reports
          for file in delete-two-pages-report.json delete-two-pages.log delete-two-pages.exit; do
            if [ -f "artifacts/$file" ]; then cp "artifacts/$file" "reports/$file"; fi
          done
          printf '%s\n' "${{ github.run_id }}" > reports/delete-two-pages-run-id.txt
          printf '%s\n' "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > reports/delete-two-pages-run-url.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports
          if git diff --cached --quiet; then
            echo 'No report changes to commit.'
          else
            git commit -m 'Delete-two-pages report [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
