name: Publish five MILLED EDGE pages live

on:
  workflow_dispatch:
  push:
    branches:
      - arena/4d7c35f7-milled-edge-automation
    paths:
      - 'trigger/publish-five-pages-live.txt'

permissions:
  contents: write

concurrency:
  group: publish-five-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish and verify the five approved pages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check confirmation phrase
        id: confirm
        run: |
          if grep -qx 'CONFIRM: PUBLISH FIVE MILLED EDGE PAGES LIVE' trigger/publish-five-pages-live.txt; then
            echo 'confirmed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'confirmed=false' >> "$GITHUB_OUTPUT"
            echo 'Trigger file is inactive. Nothing will be published.'
          fi

      - name: Set up Python
        if: steps.confirm.outputs.confirmed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.confirm.outputs.confirmed == 'true'
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Publish and verify the five pages
        id: publish
        if: steps.confirm.outputs.confirmed == 'true'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          mkdir -p artifacts
          set +e
          python scripts/publish_five_pages_live.py 2>&1 | tee artifacts/publish-five-pages.log
          STATUS=${PIPESTATUS[0]}
          echo "$STATUS" > artifacts/publish-five-pages.exit
          exit "$STATUS"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-five-pages
          path: artifacts/
          if-no-files-found: warn

      - name: Save report to repository
        if: always() && steps.confirm.outputs.confirmed == 'true'
        run: |
          mkdir -p reports artifacts
          if [ -f artifacts/publish-five-pages-report.json ]; then
            cp artifacts/publish-five-pages-report.json reports/publish-five-pages-report.json
          fi
          if [ -f artifacts/publish-five-pages.log ]; then
            cp artifacts/publish-five-pages.log reports/publish-five-pages.log
          fi
          if [ -f artifacts/publish-five-pages.exit ]; then
            cp artifacts/publish-five-pages.exit reports/publish-five-pages.exit
          fi
          printf '%s\n' "${{ github.run_id }}" > reports/publish-five-pages-run-id.txt
          printf '%s\n' "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > reports/publish-five-pages-run-url.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/publish-five-pages-report.json reports/publish-five-pages.log reports/publish-five-pages.exit reports/publish-five-pages-run-id.txt reports/publish-five-pages-run-url.txt
          if git diff --cached --quiet; then
            echo 'No report changes to commit.'
          else
            git commit -m 'Publish-five-pages report [skip ci]'
            git pull --rebase origin arena/4d7c35f7-milled-edge-automation
            git push origin HEAD:arena/4d7c35f7-milled-edge-automation
          fi
