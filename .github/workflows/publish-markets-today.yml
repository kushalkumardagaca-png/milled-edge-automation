name: Publish Market Today and retire ranking post

on:
  push:
    paths:
      - 'content/markets-today.html'
      - 'content/pages-fixes/**'
      - 'scripts/cleanup_site_pages.py'
      - 'scripts/publish_markets_today.py'
      - '.github/workflows/publish-markets-today.yml'

permissions:
  contents: read

jobs:
  update-existing-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet google-auth google-api-python-client
      - name: Clean retired routes in existing pages
        working-directory: scripts
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python cleanup_site_pages.py

  publish-market-directory:
    needs: update-existing-pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet google-auth google-api-python-client
      - name: Validate Market Today and retired-content removal locally
        working-directory: scripts
        run: python publish_markets_today.py --dry-run
      - name: Patch Market Today and delete only the exact retired Top 5,000 post
        working-directory: scripts
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python publish_markets_today.py --confirm PUBLISH
