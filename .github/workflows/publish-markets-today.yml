name: Fix Markets Today links

on:
  push:
    paths:
      - 'content/markets-today.html'
      - 'scripts/publish_markets_today.py'
      - '.github/workflows/publish-markets-today.yml'

permissions:
  contents: read

jobs:
  update-existing-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet google-auth google-api-python-client
      - name: Patch the existing page in Blogger
        working-directory: scripts
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python publish_markets_today.py
