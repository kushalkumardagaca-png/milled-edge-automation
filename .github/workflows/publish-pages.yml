name: Publish the five pages

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH to write to the live blog'
        required: false
        default: 'PUBLISH'
  push:
    paths:
      - 'content/publish-request.txt'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet google-auth google-api-python-client
      - name: Dry run
        working-directory: scripts
        run: python publish_pages.py --dry-run
      - name: Publish
        working-directory: scripts
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python publish_pages.py --confirm PUBLISH
