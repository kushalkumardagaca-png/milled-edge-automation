name: Delete all Blogger posts (destructive)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'trigger/delete-all-posts.txt'

permissions:
  contents: write

concurrency:
  group: delete-all-posts
  cancel-in-progress: false

jobs:
  delete-posts:
    name: Permanently delete every post (pages untouched)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check confirmation phrase
        id: confirm
        run: |
          if grep -qx 'CONFIRM: DELETE ALL POSTS PERMANENTLY' trigger/delete-all-posts.txt; then
            echo 'confirmed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'confirmed=false' >> "$GITHUB_OUTPUT"
            echo 'Trigger file is inactive. Nothing will be deleted.'
          fi

      - name: Set up Python
        if: steps.confirm.outputs.confirmed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.confirm.outputs.confirmed == 'true'
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Delete all posts
        id: delete
        if: steps.confirm.outputs.confirmed == 'true'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          mkdir -p artifacts
          set +e
          python scripts/delete_all_posts.py 2>&1 | tee artifacts/delete-all-posts.log
          STATUS=${PIPESTATUS[0]}
          echo "$STATUS" > artifacts/delete-all-posts.exit
          exit "$STATUS"

      - name: Upload deletion artifact
        if: always() && steps.confirm.outputs.confirmed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: delete-all-posts
          path: artifacts/
          if-no-files-found: warn

      - name: Save deletion report to repository
        if: always() && steps.confirm.outputs.confirmed == 'true'
        run: |
          mkdir -p reports
          for file in delete-all-posts-report.json delete-all-posts.log delete-all-posts.exit; do
            if [ -f "artifacts/$file" ]; then cp "artifacts/$file" "reports/$file"; fi
          done
          printf '%s\n' "${{ github.run_id }}" > reports/delete-all-posts-run-id.txt
          printf '%s\n' "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > reports/delete-all-posts-run-url.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports
          if git diff --cached --quiet; then
            echo 'No report changes to commit.'
          else
            git commit -m 'Delete-all-posts report [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
