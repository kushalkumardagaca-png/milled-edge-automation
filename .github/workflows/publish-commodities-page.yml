name: Publish commodity-only price page and retire old category posts

on:
  push:
    paths:
      - 'content/pages/commodities.html'
      - 'content/commodity-price-board.json'
      - 'scripts/build_commodities_page.py'
      - 'scripts/publish_commodities_page.py'
      - '.github/workflows/publish-commodities-page.yml'

permissions:
  contents: read

concurrency:
  group: blogger-commodities-page-publish
  cancel-in-progress: false

jobs:
  publish-and-retire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Blogger API dependencies
        run: pip install --quiet google-auth google-api-python-client
      - name: Build only the commodity page and run local safety checks
        run: |
          set -euo pipefail
          python scripts/build_commodities_page.py
          python scripts/publish_commodities_page.py --dry-run
      - name: Publish and verify the page, then move only the nine allowlisted old posts to Blogger trash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python scripts/publish_commodities_page.py --confirm PUBLISH --trash-retired-posts
