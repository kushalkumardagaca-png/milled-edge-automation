name: Publish remaining market category posts

on:
  push:
    paths:
      - 'content/market-posts/batch-2/**'
      - 'content/market-posts/batch-3/**'
      - 'content/market-posts/batch-4/**'
      - 'content/market-posts/batch-5/**'
      - 'content/market-posts/batch-2-catalog.json'
      - 'content/market-posts/batch-3-catalog.json'
      - 'content/market-posts/batch-4-catalog.json'
      - 'content/market-posts/batch-5-catalog.json'
      - 'scripts/market_categories.py'
      - 'scripts/market_page_configs.py'
      - 'scripts/build_market_posts.py'
      - 'scripts/publish_market_posts.py'
      - '.github/workflows/publish-market-category-posts.yml'

permissions:
  contents: read

jobs:
  publish-batches-2-through-5:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Blogger API client dependencies
        run: pip install --quiet google-auth google-api-python-client
      - name: Regenerate with publication dates and preflight all 84 posts
        run: |
          set -euo pipefail
          for batch in 2 3 4 5; do
            python scripts/build_market_posts.py --batch "$batch" --publication-date
            python scripts/publish_market_posts.py --batch "$batch" --dry-run
          done
      - name: Publish and publicly verify batches 2 through 5
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          for batch in 2 3 4 5; do
            python scripts/publish_market_posts.py --batch "$batch" --confirm PUBLISH
          done
