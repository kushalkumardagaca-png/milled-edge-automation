name: Publish remaining market category posts

on:
  push:
    paths:
      - 'content/market-posts/batch-2/**'
      - 'content/market-posts/batch-3/**'
      - 'content/market-posts/batch-4/**'
      - 'content/market-posts/batch-5/**'
      - 'content/market-posts/batch-2-catalog.json'
      - 'content/market-posts/batch-3-catalog.json'
      - 'content/market-posts/batch-4-catalog.json'
      - 'content/market-posts/batch-5-catalog.json'
      - 'scripts/market_categories.py'
      - 'scripts/market_page_configs.py'
      - 'scripts/build_market_posts.py'
      - 'scripts/publish_market_posts.py'
      - 'scripts/verify_market_posts.py'
      - '.github/workflows/publish-market-category-posts.yml'

permissions:
  contents: read
  actions: write

jobs:
  publish-batches-2-through-5:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Blogger API client dependencies
        run: pip install --quiet google-auth google-api-python-client
      - name: Regenerate with publication dates and preflight all 84 posts
        run: |
          set -euo pipefail
          for batch in 2 3 4 5; do
            python scripts/build_market_posts.py --batch "$batch" --publication-date
            python scripts/publish_market_posts.py --batch "$batch" --dry-run
          done
      - name: Cancel stalled attempt and wait for it to stop
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          run_id = "41942337869"
          base = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}"
          headers = {"Accept": "application/vnd.github+json", "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}", "X-GitHub-Api-Version": "2022-11-28"}
          def get_run():
              req = urllib.request.Request(base, headers=headers)
              return json.load(urllib.request.urlopen(req, timeout=20))
          current = get_run()
          if current["status"] != "completed":
              req = urllib.request.Request(base + "/cancel", headers=headers, method="POST")
              try:
                  urllib.request.urlopen(req, timeout=20).read()
              except urllib.error.HTTPError as exc:
                  if exc.code not in (409, 422): raise
              for _ in range(36):
                  time.sleep(5)
                  current = get_run()
                  if current["status"] == "completed": break
              else:
                  raise SystemExit("Previous publication attempt did not stop within three minutes; refusing concurrent publishing.")
          print("Previous run status:", current["status"], current.get("conclusion"))
          PY
      - name: Publish and publicly verify batches 2 through 5
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          for batch in 2 3 4 5; do
            python scripts/publish_market_posts.py --batch "$batch" --confirm PUBLISH --allow-public-check-pending
          done
      - name: Verify all 104 public category URLs and post features
        run: python scripts/verify_market_posts.py --batches 2,3,4,5
