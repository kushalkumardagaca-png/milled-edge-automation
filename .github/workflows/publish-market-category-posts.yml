name: Publish market category posts

on:
  push:
    paths:
      - 'content/market-posts/**'
      - 'scripts/market_categories.py'
      - 'scripts/market_page_configs.py'
      - 'scripts/build_market_posts.py'
      - 'scripts/publish_market_posts.py'
      - '.github/workflows/publish-market-category-posts.yml'

permissions:
  contents: read

jobs:
  publish-batch-1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Blogger API client dependencies
        run: pip install --quiet google-auth google-api-python-client
      - name: Regenerate batch 1 and validate before publishing
        run: |
          python scripts/build_market_posts.py --batch 1
          python scripts/publish_market_posts.py --dry-run
      - name: Publish or update only the first 20 category posts
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python scripts/publish_market_posts.py --confirm PUBLISH
